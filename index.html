<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fae9e3"><meta name="color-scheme" content="light">
<title>소정 누나 생일 축하드립니다! 🎂</title>
<meta name="description" content="소정 누나를 위해 피카츄와 피츄가 준비한 작은 생일 파티. 큰절도 준비했습니다. — 이찬희 드림">
<meta property="og:type" content="website"><meta property="og:locale" content="ko_KR">
<meta property="og:title" content="소정 누나 생일 축하드립니다! 🎂">
<meta property="og:description" content="축하하러 왔습니다. 큰절도 준비했습니다 🙇 — 이찬희 드림">
<meta property="og:url" content="https://pollmap.github.io/sojeong-birthday-card-2026/">
<meta property="og:image" content="https://pollmap.github.io/sojeong-birthday-card-2026/og-sojeong-party-v2.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="소정 누나 생일 축하드립니다! 파티 모자를 쓴 피카츄와 피츄, 딸기 생크림 케이크. 이찬희 드림">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="소정 누나 생일 축하드립니다! 🎂">
<meta name="twitter:description" content="축하하러 왔습니다. 큰절도 준비했습니다 🙇 — 이찬희 드림">
<meta name="twitter:image" content="https://pollmap.github.io/sojeong-birthday-card-2026/og-sojeong-party-v2.png">
<link rel="canonical" href="https://pollmap.github.io/sojeong-birthday-card-2026/">
<link rel="stylesheet" href="party.css?v=2"><script src="card.js?v=2" defer></script>
</head><body>
<main class="card" id="card" data-state="closed" aria-label="소정 누나 생일 카드">
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="garland" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="balloon balloon-one" aria-hidden="true"></div><div class="balloon balloon-two" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span></div>
  <section class="invitation" id="invitation" aria-labelledby="invite-title">
    <p class="eyebrow">오늘의 주인공에게</p>
    <h1 id="invite-title">소정 누나,<br>초대장이 도착했어요.</h1>
    <div class="envelope" aria-hidden="true"><div class="letter"><span>HAPPY</span><strong>BIRTHDAY</strong><span class="letter-heart">♥</span></div><div class="envelope-front"></div><div class="seal">S</div><img class="peek peek-pika" src="assets/pika-party.svg" alt=""><img class="peek peek-pichu" src="assets/pichu-party.svg" alt=""></div>
    <p class="invite-note">축하하러 왔습니다.<br>큰절도 준비했습니다.</p>
    <button class="primary enter" id="enter" type="button">생일 파티 입장하기 <span aria-hidden="true">→</span></button>
    <p class="from">이찬희 드림</p>
  </section>
  <section class="party" id="party" aria-label="생일 파티" hidden>
    <header class="headline"><p class="eyebrow">HAPPY BIRTHDAY</p><h2 tabindex="-1" id="greeting"><span>소정 누나</span><strong>생일 축하드립니다!</strong></h2><p class="caption" id="caption" aria-live="polite">축하단 입장합니다.</p></header>
    <div class="stage" id="stage">
      <div class="halo" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div>
      <div class="actor actor-pika" id="pika"><span class="bubble" id="pika-speech" aria-hidden="true">누나, 받으십시오!</span><div class="puppet"><img src="assets/pika-party.svg" width="230" height="260" alt="파티 모자를 쓴 피카츄"></div><span class="actor-shadow" aria-hidden="true"></span></div>
      <div class="actor actor-pichu" id="pichu"><span class="bubble" id="pichu-speech" aria-hidden="true">앗, 같이요!</span><div class="puppet"><img src="assets/pichu-party.svg" width="230" height="260" alt="파티 모자를 쓴 피츄"></div><span class="actor-shadow" aria-hidden="true"></span></div>
      <div class="cake" id="cake"><img src="assets/party-cake.svg" width="280" height="280" alt="딸기 생크림 케이크와 세 개의 촛불"><span class="flame flame-one" aria-hidden="true"></span><span class="flame flame-two" aria-hidden="true"></span><span class="flame flame-three" aria-hidden="true"></span></div>
      <div class="bow-label" aria-hidden="true">꾸벅.</div>
    </div>
    <footer class="party-footer"><p class="signature">마음을 담아, <strong>이찬희 드림</strong></p><div class="controls"><button id="sound" type="button" aria-pressed="false">♪ 소리 켜기</button><button id="replay" type="button">↻ 다시 보기</button><button id="share" type="button">링크 복사</button></div><p class="share-status" id="share-status" role="status"></p></footer>
  </section>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <noscript><p class="no-script">소정 누나 생일 축하드립니다! 🎂<br>이찬희 드림<br>움직이는 카드는 JavaScript를 켜면 볼 수 있어요.</p></noscript>
</main>
</body></html>
