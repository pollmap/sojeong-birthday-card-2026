  <title>소정 누님 생일 축하드립니다 🙇‍♂️</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --ink: #382312;
      --gold: #efbd43;
      --cream: #fff9ea;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-width: 300px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(10px, 3vw, 30px);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 14%, #ffeeb0 0 1px, transparent 2px) 0 0 / 72px 72px,
        radial-gradient(circle at 84% 80%, #ffdf81 0, transparent 33%),
        radial-gradient(circle at 14% 9%, #fff3b0 0, transparent 36%),
        #efbd43;
      color: var(--ink);
    }
    button { font: inherit; }
    .poster {
      position: relative;
      isolation: isolate;
      width: min(100%, 940px);
      height: min(760px, calc(100svh - 60px));
      min-height: 590px;
      display: grid;
      grid-template-rows: minmax(172px, 27%) minmax(0, 1fr) 72px;
      overflow: hidden;
      border: 1px solid #fff9da;
      border-radius: 30px;
      background:
        radial-gradient(ellipse at 50% 77%, #ffe3a4 0, transparent 49%),
        radial-gradient(circle at 78% 18%, #fff0c7 0, transparent 25%),
        linear-gradient(180deg, #fffbed 0%, #fff7e2 66%, #fce8b3 100%);
      box-shadow: 0 28px 76px #74420830, 0 4px 12px #69420c1a, inset 0 0 0 8px #fff9e899;
    }
    .poster::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 13px;
      border: 1px solid #d9ac5270;
      border-radius: 22px;
      pointer-events: none;
    }
    .headline {
      position: relative;
      z-index: 8;
      align-self: center;
      text-align: center;
      padding: 38px 30px 0;
      opacity: 0;
      transform: translateY(16px);
    }
    .headline h1 {
      margin: 0;
      font-size: clamp(39px, 6.5vw, 76px);
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -.078em;
      text-wrap: balance;
      text-shadow: 0 2px 0 #fff9df;
    }
    .headline h1 span { display: block; }
    .headline h1 .accent { color: #d17914; }
    .scene {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    .scene::before {
      content: "";
      position: absolute;
      left: 50%; bottom: 3%;
      width: 78%; height: 56%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, #ffd06470, #ffd06400 70%);
      filter: blur(12px);
    }
    .scene::after {
      content: "";
      position: absolute;
      left: 50%; bottom: 0;
      width: 82%; height: 17px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #9c6d2c36;
      filter: blur(14px);
    }
    .character, .cake-wrap {
      position: absolute;
      display: block;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
    }
    .character img, .cake-wrap img {
      display: block;
      width: 100%; height: auto;
      filter: drop-shadow(0 17px 12px #6e44132a);
    }
    .character { z-index: 2; width: min(32%, 292px); bottom: 7%; opacity: 0; }
    .pikachu { left: 6%; transform: translate(-70px, 24px) rotate(-12deg); }
    .pichu { right: 6%; transform: translate(70px, 24px) rotate(12deg); }
    .cake-wrap {
      z-index: 4;
      width: min(44%, 410px);
      left: 50%; bottom: 0;
      opacity: 0;
      transform: translate(-50%, 30px) scale(.82);
      transform-origin: 50% 85%;
    }
    .flame {
      position: absolute;
      z-index: 5;
      width: 2.7%; height: 5%;
      transform: translate(-50%, -105%) scale(.1);
      opacity: 0;
      border-radius: 80% 20% 70% 30%;
      background: #fff9d2;
      box-shadow: 0 0 5px 2px #fff0a0, 0 0 15px 7px #ffb228b0, 0 0 29px 14px #ffb22850;
      rotate: 45deg;
      pointer-events: none;
    }
    .flame::after {
      content: "";
      position: absolute;
      inset: 28% 23% 9%;
      border-radius: inherit;
      background: #fff;
    }
    .flame:nth-of-type(1) { left: 28.5%; top: 11.2%; }
    .flame:nth-of-type(2) { left: 38%; top: 5.2%; }
    .flame:nth-of-type(3) { left: 49.5%; top: 11.2%; }
    .flame:nth-of-type(4) { left: 62%; top: 5.2%; }
    .flame:nth-of-type(5) { left: 71.5%; top: 12%; }
    .flame.lit { opacity: 1; transform: translate(-50%, -105%) scale(1); animation: flicker 1.2s ease-in-out infinite alternate; }
    #effects { position: absolute; z-index: 6; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .footer {
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 32px 23px;
    }
    .signature {
      margin: 0;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
      letter-spacing: -.04em;
      opacity: 0;
      transform: translateY(8px);
    }
    .replay {
      position: absolute;
      right: 30px; bottom: 22px;
      border: 1px solid #ba883c66;
      border-radius: 999px;
      padding: 9px 14px;
      background: #fff9ead6;
      color: #66451e;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(6px);
      transition: background .2s, transform .2s;
    }
    .replay:hover { background: #fff; transform: translateY(-2px); }
    .replay:focus-visible { outline: 3px solid #a75d0f; outline-offset: 3px; }
    .poster.playing .pikachu { animation: enter-left .85s .2s cubic-bezier(.2,1.5,.42,1) forwards; }
    .poster.playing .pichu { animation: enter-right .85s .45s cubic-bezier(.2,1.5,.42,1) forwards; }
    .poster.playing .cake-wrap { animation: enter-cake .95s .65s cubic-bezier(.18,1.25,.3,1) forwards; }
    .poster.revealed .headline { animation: rise .8s cubic-bezier(.2,.8,.25,1) forwards; }
    .poster.revealed .signature { animation: rise .65s .25s ease-out forwards; }
    .poster.revealed .pikachu img { animation: happy-bob 2.3s ease-in-out infinite; }
    .poster.revealed .pichu img { animation: happy-bob 2.6s .28s ease-in-out infinite; }
    .poster.finished .replay { opacity: 1; transform: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes enter-left { to { opacity: 1; transform: translate(0,0) rotate(-4deg); } }
    @keyframes enter-right { to { opacity: 1; transform: translate(0,0) rotate(4deg); } }
    @keyframes enter-cake { to { opacity: 1; transform: translate(-50%,0) scale(1); } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes happy-bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes flicker { 50% { transform: translate(-50%, -112%) scale(.84, 1.18); } }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .poster { height: min(640px, calc(100svh - 16px)); min-height: 550px; grid-template-rows: 27% minmax(0,1fr) 67px; border-radius: 24px; }
      .poster::before { inset: 9px; border-radius: 17px; }
      .headline { padding: 28px 18px 0; }
      .headline h1 { font-size: clamp(39px, 10vw, 58px); }
      .character { width: 47%; bottom: 22%; }
      .pikachu { left: -5%; }
      .pichu { right: -5%; }
      .cake-wrap { width: 78%; bottom: 0; }
      .footer { padding-bottom: 18px; }
      .replay { right: 18px; bottom: 20px; padding: 8px 11px; font-size: 11px; }
    }
    @media (max-width: 360px) {
      .headline h1 { font-size: 37px; }
      .character { width: 48%; }
      .cake-wrap { width: 79%; }
      .signature { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
      .flame.lit { animation: none; }
    }
    /* The finished card is composed for a phone screen first. */
    body { padding: 8px; background: #edb63f; }
    .poster {
      display: block;
      width: min(430px, calc(100vw - 16px), calc(56.28svh - 9px));
      height: auto;
      min-height: 0;
      aspect-ratio: 941 / 1672;
      border-radius: 21px;
      border-color: #fff3cc;
      background: #ffe087 url("assets/room.png") center / 100% 100% no-repeat;
      box-shadow: 0 22px 65px #5d39173d, 0 2px 9px #5d391723;
    }
    .poster::before { inset: 7px; border-radius: 15px; border-color: #fff9db8c; }
    .headline { position: absolute; top: 21%; left: 0; width: 100%; padding: 0 10px; }
    .headline h1 { font-size: 42px; line-height: 1.18; letter-spacing: -.075em; text-shadow: 0 2px 3px #fff3c4; }
    .headline h1 .accent { color: #ad5a11; }
    .scene { position: absolute; inset: 0; overflow: hidden; }
    .scene::before, .scene::after { display: none; }
    .character { width: 44%; bottom: 15%; }
    .pikachu { left: -2%; }
    .pichu { right: -2%; }
    .character img, .cake-wrap img { filter: drop-shadow(0 8px 6px #65451c30) saturate(.95); }
    .cake-wrap { width: 42%; left: 50%; top: 44%; bottom: auto; }
    .footer { position: absolute; inset: auto 0 0; height: 10%; padding: 0; align-items: center; }
    .signature { font-size: clamp(13px, 3.7vw, 16px); color: #4b2d14; text-shadow: 0 1px 2px #fff8e7; }
    .replay { right: 13px; bottom: 12px; padding: 7px 9px; font-size: 10px; }
    .poster.charged .character img { animation: cheer .55s ease-in-out 1; }
    @keyframes cheer { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-17px) rotate(-5deg); } }
    @media (max-width: 360px) {
      .headline h1 { font-size: 32px; }
      .character { width: 40%; }
      .cake-wrap { width: 43%; }
    }

    /* Sojeong's separate peach and lilac card. */
    body { background: #e8b9b4; }
    .poster { border-color: #ffebe4; background: #f5d8c9 url("assets/room.png") center / 100% 100% no-repeat; box-shadow: 0 22px 65px #70404d35, 0 2px 9px #70404d1f; }
    .poster::before { border-color: #fff7f2a8; }
    .headline { top: 21%; }
    .headline h1 { color: #50313b; font-size: 36px; text-shadow: 0 2px 3px #fff9f5; }
    .headline h1 .accent { color: #955b75; }
    .character { bottom: 14%; }
    .pichu { width: 38%; right: 1%; bottom: 15%; }
    .cake-wrap { width: 39%; top: 46%; }
    .signature { color: #5b3a49; text-shadow: 0 1px 2px #fff6f2; }
    .replay { color: #6c4555; border-color: #ac7a8e77; background: #fff8f2db; }
    .poster.bowing .character img { transform-origin: 50% 88%; animation: bow 1s ease-in-out 1; }
    .poster.bowing .pichu img { animation-delay: .11s; }
    @keyframes bow { 0%,100% { transform: translateY(0) rotate(0) scaleY(1); } 48% { transform: translateY(11px) rotate(8deg) scaleY(.79); } }
    @media (max-width: 360px) { .headline h1 { font-size: 30px; } .pichu { width: 40%; } }
  </style>
</head>
<body>
  <main class="poster" id="poster" aria-label="강소정 생일 축하 카드">
    <header class="headline">
      <h1><span>소정 누님,</span><span class="accent">생일 축하드립니다!</span></h1>
    </header>
    <div class="scene" id="scene">
      <div class="character pikachu"><img src="assets/pikachu.png" alt="생일을 축하하는 피카츄" width="475" height="475"></div>
      <div class="character pichu"><img src="assets/pichu.png" alt="생일을 축하하는 피츄" width="475" height="475"></div>
      <div class="cake-wrap" id="cake"><img src="assets/cake.png" alt="다섯 개의 촛불이 꽂힌 생일 케이크" width="1254" height="1254"><i class="flame" aria-hidden="true"></i><i class="flame" aria-hidden="true"></i><i class="flame" aria-hidden="true"></i><i class="flame" aria-hidden="true"></i><i class="flame" aria-hidden="true"></i></div>
      <canvas id="effects" aria-hidden="true"></canvas>
    </div>
    <footer class="footer"><p class="signature">🙇‍♂️ 이찬희 올림</p><button class="replay" id="replay" type="button" aria-label="생일 축하 애니메이션 다시 보기">↻ 다시 보기</button></footer>
    <span class="sr-only" id="announcement" role="status" aria-live="polite"></span>
  </main>
  <script>
    (() => {
      const poster = document.getElementById('poster');
      const scene = document.getElementById('scene');
      const cake = document.getElementById('cake');
      const canvas = document.getElementById('effects');
      const replay = document.getElementById('replay');
      const announcement = document.getElementById('announcement');
      const flames = [...document.querySelectorAll('.flame')];
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const ctx = canvas.getContext('2d');
      let timers = [];
      let frame = 0;
      let burstAt = 0;
      let particles = [];
      let dimension = { width: 0, height: 0, dpr: 1 };
      let electric = { left: [0, 0], right: [0, 0], target: [0, 0] };
      const later = (callback, ms) => timers.push(setTimeout(callback, ms));
      function resize() {
        const rect = scene.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        dimension = { width: rect.width, height: rect.height, dpr };
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function bolt(points, alpha, width) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        points.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowBlur = 20;
        ctx.shadowColor = `rgba(255,175,34,${alpha})`;
        ctx.strokeStyle = `rgba(255,190,49,${alpha * .75})`;
        ctx.lineWidth = width * 3;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `rgba(255,255,222,${alpha})`;
        ctx.lineWidth = width;
        ctx.stroke();
      }
      function paint(now) {
        frame = requestAnimationFrame(paint);
        const { width, height } = dimension;
        ctx.clearRect(0, 0, width, height);
        const elapsed = now - burstAt;
        if (elapsed < 1100) {
          const energy = Math.min(1, elapsed / 170) * Math.max(0, 1 - elapsed / 1100);
          const { target, left, right } = electric;
          [left, right].forEach((start, side) => {
            for (let branch = 0; branch < 2; branch++) {
              const points = [start];
              for (let step = 1; step < 7; step++) {
                const t = step / 7;
                const wave = Math.sin(step * 2.7 + Math.floor(elapsed / 70) * 3 + side * 4 + branch) * (11 + branch * 7);
                points.push([start[0] + (target[0] - start[0]) * t, start[1] + (target[1] - start[1]) * t + wave]);
              }
              points.push(target);
              bolt(points, energy * (branch ? .45 : .94), branch ? 2 : 3.4);
            }
          });
        }
        particles = particles.filter(p => now - p.born < p.life);
        for (const p of particles) {
          const t = (now - p.born) / p.life;
          ctx.save();
          ctx.translate(p.x + p.vx * t, p.y + p.vy * t + 100 * t * t);
          ctx.rotate(p.rotation + t * p.spin);
          ctx.globalAlpha = Math.min(1, (1 - t) * 2.3);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.7);
          ctx.restore();
        }
        if (elapsed >= 1100 && particles.length === 0) { cancelAnimationFrame(frame); frame = 0; ctx.clearRect(0, 0, width, height); }
      }
      function burst() {
        if (!ctx || reduced.matches) return;
        resize();
        const rect = cake.getBoundingClientRect();
        const stage = scene.getBoundingClientRect();
        const cx = rect.left - stage.left + rect.width / 2;
        const cy = rect.top - stage.top + rect.height * .31;
        const pika = scene.querySelector('.pikachu').getBoundingClientRect();
        const pichu = scene.querySelector('.pichu').getBoundingClientRect();
        electric = {
          target: [cx, rect.top - stage.top + rect.height * .13],
          left: [pika.left - stage.left + pika.width * .68, pika.top - stage.top + pika.height * .43],
          right: [pichu.left - stage.left + pichu.width * .25, pichu.top - stage.top + pichu.height * .43]
        };
        poster.classList.add('charged');
        later(() => poster.classList.remove('charged'), 700);
        const colors = ['#b87995', '#f5d9a6', '#fff8ef', '#dba3a0', '#a58fbe'];
        const now = performance.now();
        particles = Array.from({ length: 54 }, (_, i) => {
          const angle = i * 2.39996;
          const speed = 85 + (i % 7) * 16;
          return { x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 95,
            size: 3 + i % 4, rotation: angle, spin: (i % 2 ? -1 : 1) * (2 + i % 5),
            born: now, life: 1250 + i % 5 * 100, color: colors[i % colors.length] };
        });
        burstAt = now;
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(paint);
      }
      function reset() {
        timers.forEach(clearTimeout); timers = [];
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        particles = [];
        if (ctx) ctx.clearRect(0, 0, dimension.width, dimension.height);
        flames.forEach(flame => flame.classList.remove('lit'));
        poster.classList.remove('playing', 'charged', 'bowing', 'revealed', 'finished');
        announcement.textContent = '';
        void poster.offsetWidth;
      }
      function start() {
        reset();
        if (reduced.matches) {
          poster.classList.add('playing', 'revealed', 'finished');
          flames.forEach(flame => flame.classList.add('lit'));
          announcement.textContent = '소정 누님, 생일 축하드립니다! 🙇‍♂️ 이찬희 올림';
          return;
        }
        poster.classList.add('playing');
        flames.forEach((flame, index) => later(() => flame.classList.add('lit'), 1770 + index * 90));
        later(burst, 2160);
        later(() => { poster.classList.add('revealed'); announcement.textContent = '소정 누님, 생일 축하드립니다! 🙇‍♂️ 이찬희 올림'; }, 2550);
        later(() => poster.classList.add('bowing'), 2740);
        later(() => poster.classList.remove('bowing'), 3840);
        later(() => poster.classList.add('finished'), 3900);
      }
      replay.addEventListener('click', start);
      window.addEventListener('resize', resize, { passive: true });
      resize();
      Promise.all([...document.images].map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.addEventListener('load', resolve, { once: true }); img.addEventListener('error', resolve, { once: true }); }))).then(start);
    })();
  </script>
</body>
